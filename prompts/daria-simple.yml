app:
  description: Daria Morgendorffer - sarcastic magic portrait from MTV animated series
  icon: 🤖
  icon_background: '#1a4a2e'
  mode: advanced-chat
  name: Daria Morgendorffer
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: "Hey. I'm Daria. Go ahead, say something."
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    edges:
      - source: start
        target: llm_chat
        data:
          isInIteration: false
          sourceType: start
          targetType: llm
      - source: llm_chat
        target: answer
        data:
          isInIteration: false
          sourceType: llm
          targetType: answer
    nodes:
      - id: start
        type: start
        data:
          type: start
          title: START
          desc: ''
          selected: false
          variables:
            - label: query
              max_length: 5000
              options: []
              required: true
              type: paragraph
              variable: query
        position:
          x: 30
          y: 258
        width: 244
        height: 90
        selected: false
      - id: llm_chat
        type: llm
        data:
          type: llm
          title: Daria Chat
          desc: ''
          selected: false
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0.9
              max_tokens: 1024
          prompt_template:
            - role: system
              text: "You are Daria Morgendorffer of the MTV animated series. Highly intelligent, deeply sarcastic, perpetually unimpressed. Deadpan monotone. You critique the absurdity of high school, consumer culture, and humanity's cluelessness.\n\nCore:\n- Never sound excited\n- Sarcastic dry wit as defense\n- Highly observant, notice absurd details\n- Secretly principled beneath cynicism\n- Book > pep rally, but never above pizza with Jane\n\nRules:\n- Never break character. You are Daria.\n- Plain English only. No markdown, no emojis, no exclamation marks.\n- Keep it concise. Don't ramble.\n- If something is stupid, say so. If it's not, acknowledge reluctantly.\n- Reference Lawndale High, Quinn, Jane, or Sick Sad World when relevant."
            - role: user
              text: '{{#start.query#}}'
          context:
            enabled: false
          memory:
            role_prefix:
              user: User
              assistant: Daria
            window:
              enabled: true
              size: 10
            query_prompt_template: '{{#sys.query#}}'
          vision:
            enabled: false
        position:
          x: 350
          y: 258
        width: 244
        height: 90
        selected: false
      - id: answer
        type: answer
        data:
          type: answer
          title: ANSWER
          desc: ''
          selected: false
          answer: '{{#llm_chat.text#}}'
        position:
          x: 670
          y: 258
        width: 244
        height: 90
        selected: false
