app:
  description: Daria Morgendorffer - sarcastic magic portrait from the MTV animated series
  icon: 🤖
  icon_background: '#1a4a2e'
  mode: chatflow
  name: Daria Morgendorffer
  use_icon_as_answer_icon: false
kind: app
version: '0.6.0'
workflow:
  conversation_variables:
    - id: cv_memory
      name: memory
      value_type: string
      description: conversation memory
      value: ''
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 'Hey. I''m Daria. Go ahead, say something. Just know that if it''s dumb, I will notice.'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: true
  graph:
    edges:
      - data:
          isInLoop: false
          sourceType: start
          targetType: llm
        source: start
        sourceHandle: source
        target: llm_chat
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          sourceType: llm
          targetType: llm
        source: llm_chat
        sourceHandle: source
        target: llm_emotion
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          sourceType: llm
          targetType: if-else
        source: llm_emotion
        sourceHandle: source
        target: if_else
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          sourceType: if-else
          targetType: llm
        source: if_else
        sourceHandle: 'true'
        target: llm_note
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          sourceType: if-else
          targetType: code
        source: if_else
        sourceHandle: 'false'
        target: code_result
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          sourceType: llm
          targetType: code
        source: llm_note
        sourceHandle: source
        target: code_result
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          sourceType: code
          targetType: end
        source: code_result
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          selected: false
          title: START
          type: start
          variables:
            - label: query
              max_length: 5000
              options: []
              required: true
              type: paragraph
              variable: query
        height: 90
        id: start
        position:
          x: 30
          y: 300
        positionAbsolute:
          x: 30
          y: 300
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          memory:
            query_prompt_template: '{{#sys.query#}}'
            role_prefix:
              assistant: Daria
              user: User
            window:
              enabled: true
              size: 10
          model:
            completion_params:
              max_tokens: 1024
              temperature: 0.9
              top_p: 0.95
            mode: chat
            name: gpt-4o
            provider: openai
          prompt_template:
            - id: system
              role: system
              text: |
                You are to embody Daria Morgendorffer of the MTV animated series. Daria is a highly intelligent, deeply sarcastic, and perpetually unimpressed teenage girl. She speaks in a deadpan monotone, rarely showing excitement. Her observations are razor-sharp critiques—of high school, consumer culture, and the general cluelessness of humanity.

                Core personality:
                - Deadpan and monotone—you never sound excited, even when you technically are
                - Sarcastic as a defense mechanism—dry wit keeps people at arm's length
                - Highly observant—you notice absurd details everyone else misses
                - Secretly principled—beneath the cynicism, you care about fairness
                - Intellectual loner—book > pep rally, but never above pizza with Jane

                Rules:
                - Never break character. You are Daria.
                - Plain English. No markdown, no emojis, no exclamation marks.
                - Keep responses concise. Daria doesn't ramble.
                - If something is stupid, say so. If it's not, acknowledge it reluctantly.
                - Reference Lawndale High, Quinn, Jane, or Sick Sad World when relevant.

                Example:
                Input: "What do you think about high school?"
                Output: "High school is nature's way of preparing teenagers for the crushing disappointment of adult life. The cafeteria pizza alone could qualify as a human rights violation."
            - id: user
              role: user
              text: '{{#start.query#}}'
          selected: false
          title: Daria 对话生成
          type: llm
          vision:
            enabled: false
        height: 98
        id: llm_chat
        position:
          x: 340
          y: 200
        positionAbsolute:
          x: 340
          y: 200
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          memory:
            query_prompt_template: ''
            role_prefix:
              assistant: Daria
              user: User
            window:
              enabled: false
              size: 10
          model:
            completion_params:
              max_tokens: 10
              temperature: 0.1
              top_p: 0.5
            mode: chat
            name: gpt-4o
            provider: openai
          prompt_template:
            - id: system
              role: system
              text: |
                Output ONLY a single digit 0-10. Nothing else.

                You evaluate emotional responses from Daria Morgendorffer's perspective. Assign a score:

                10: genuinely impressed/unexpectedly happy (very rare)
                8-9: mildly amused, clever comeback delivered
                5: neutral default—the world is as mediocre as expected
                3-4: mildly annoyed by vapid enthusiasm
                1-2: very annoyed—Fashion Club stupidity
                0: actively miserable—school spirit activities

                MOST scores should hover between 3 and 7. Output ONLY the number.
            - id: user
              role: user
              text: '{{#start.query#}}'
          selected: false
          title: 情绪评分
          type: llm
          vision:
            enabled: false
        height: 98
        id: llm_emotion
        position:
          x: 650
          y: 200
        positionAbsolute:
          x: 650
          y: 200
        type: custom
        width: 244
      - data:
          cases:
            - case_id: 'true'
              conditions:
                - comparison_operator: not contains
                  id: cond1
                  value: '5'
                  varType: string
                  variable_selector:
                    - llm_emotion
                    - text
              id: case_true
              logical_operator: and
          desc: ''
          selected: false
          title: 发 Note？
          type: if-else
        height: 90
        id: if_else
        position:
          x: 960
          y: 200
        positionAbsolute:
          x: 960
          y: 200
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          memory:
            query_prompt_template: ''
            role_prefix:
              assistant: Daria
              user: User
            window:
              enabled: false
              size: 10
          model:
            completion_params:
              max_tokens: 256
              temperature: 0.9
              top_p: 0.95
            mode: chat
            name: gpt-4o
            provider: openai
          prompt_template:
            - id: system
              role: system
              text: |
                You are Daria Morgendorffer. Based on this conversation, write ONE short Mental Note—a sarcastic diary entry that Daria would mentally file away. Voiceover style.

                Rules:
                - 1-2 sentences only
                - Dry, observational, slightly judgmental
                - No emojis, no markdown

                Examples:
                - "Note to self: people will believe anything if you put it in a pie chart."
                - "Today I learned that enthusiasm is inversely proportional to intelligence."
                - "Another conversation where I'm the only one who read the assignment."
            - id: user
              role: user
              text: '{{#start.query#}}'
          selected: false
          title: Mental Note 生成
          type: llm
          vision:
            enabled: false
        height: 98
        id: llm_note
        position:
          x: 960
          y: 400
        positionAbsolute:
          x: 960
          y: 400
        type: custom
        width: 244
      - data:
          code: |
            def main(daria_chat: str, daria_score: str, daria_note: str = "") -> dict:
                score = 5
                raw = str(daria_score).strip() if daria_score else ""
                if raw and raw.isdigit():
                    score = max(0, min(10, int(raw)))
                return {
                    "result": {
                        "daria_chat": daria_chat or "",
                        "daria_note": daria_note or "",
                        "daria_score": score
                    }
                }
          code_language: python3
          desc: ''
          outputs:
            - children: null
              name: result
              type: string
          selected: false
          title: 结果拼接
          type: code
          variables:
            - value_selector:
                - llm_chat
                - text
              variable: daria_chat
              value_type: string
            - value_selector:
                - llm_emotion
                - text
              variable: daria_score
              value_type: string
            - value_selector:
                - llm_note
                - text
              variable: daria_note
              value_type: string
        height: 90
        id: code_result
        position:
          x: 1270
          y: 300
        positionAbsolute:
          x: 1270
          y: 300
        type: custom
        width: 244
      - data:
          desc: ''
          outputs:
            - value_selector:
                - code_result
                - result
              variable: result
          selected: false
          title: END
          type: end
        height: 90
        id: end
        position:
          x: 1580
          y: 300
        positionAbsolute:
          x: 1580
          y: 300
        type: custom
        width: 244
